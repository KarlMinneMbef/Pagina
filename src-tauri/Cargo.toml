[package]
name = "xmd-editor"
version = "0.4.5"
description = "Pagina - Editeur Markdown WYSIWYG, par Mon BE Fluides"
authors = ["Mon BE Fluides"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xmd_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# Uniquement pour print_commands.rs (ShowPrintUI natif WebView2 — voir ce
# fichier pour le pourquoi) : versions alignées sur celles déjà résolues
# transitivement par wry/tauri-runtime-wry pour éviter deux copies
# incompatibles des mêmes types COM.
[target.'cfg(windows)'.dependencies]
windows = "0.61"
webview2-com = "0.38"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
